server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: /dashboard, /documents/3/chat ... don't exist as files.
    # Serve index.html and let React Router show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have a content hash in their name: safe to cache for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always fetch a fresh index.html so new deployments are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
